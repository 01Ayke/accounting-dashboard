services:
  mysql:
    image: mysql:8.1
    container_name: mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root   
      MYSQL_DATABASE: lakonta     
    ports:
      - "2020:3306"             
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d  

volumes:
  mysql-data:
